# Max-quality profile: high VRAM, more specialists, several AMT adapters, consensus fusion.
profile: max_quality
stages:
  separation:
    # broad_adapter: demucs      # needs `pip install torch demucs` + `mrep models download separation demucs`
    specialist_threshold: 0.5
    specialists:
      drums: drum_bandsplit
      # Register ML specialists under kind "separation" and list them here, e.g.
      # piano: demucs_piano
      # strings: bandit_strings
  transcription:
    full_mix_amt: true
    polyphony: 6
    min_note_seconds: 0.05
    pitched_adapters: [spectral_peaks]   # e.g. [spectral_peaks, basic_pitch] once `pip install basic-pitch`
    drums_adapters: [onset_bands]        # add a learned drum transcriber here for consensus
  fusion:
    onset_tolerance_seconds: 0.04
  reconstruction:
    track_renders: true
